[project]
name = "matrisathi-api"
version = "0.1.0"
description = "MatriSathi backend — independent MCH companion API"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.0",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "pyjwt==2.9.0",
    "pwdlib[argon2]==0.2.1",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
